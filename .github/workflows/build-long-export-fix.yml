name: Build long-export stability fix

on:
  workflow_dispatch:
  push:
    branches: [fix/long-export-stability]

jobs:
  verify-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-long-export-stability-installer
          path: release/*.exe
          if-no-files-found: error
