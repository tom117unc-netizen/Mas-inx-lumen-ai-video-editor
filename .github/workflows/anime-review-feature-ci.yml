name: Anime review feature CI

on:
  push:
    branches: [feature/anime-review-update-02]
  workflow_dispatch:

jobs:
  verify:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Lumen-Fixed
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Lumen-Fixed/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Use default Electron icons when the upstream build resources are absent
        shell: pwsh
        run: |
          node -e "const fs=require('fs'); const p=JSON.parse(fs.readFileSync('package.json','utf8')); if (!fs.existsSync('build/icon.ico')) { delete p.build.win.icon; delete p.build.nsis.installerIcon; delete p.build.nsis.uninstallerIcon; delete p.build.nsis.installerHeaderIcon; for (const a of p.build.fileAssociations || []) delete a.icon; fs.writeFileSync('package.json', JSON.stringify(p, null, 2) + '\n'); }"
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: Lumen-anime-review-Windows-installer
          path: Lumen-Fixed/release/*.exe
          if-no-files-found: error
